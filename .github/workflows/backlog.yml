name: Atualizar backlog

on:
  issues:
    types: [closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: public-backlog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Obter fontes da branch principal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Ler issues e gerar documentação pública
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update_backlog.py --sync-github
          python3 scripts/update_backlog.py --check
      - name: Publicar apenas os resumos de progresso
        run: |
          git add README.md README.pt-BR.md docs/BACKLOG.md docs/backlog.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: atualizar progresso do backlog [skip ci]'
          git push origin HEAD:main
